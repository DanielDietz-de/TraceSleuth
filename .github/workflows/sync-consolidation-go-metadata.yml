name: Sync consolidation Go metadata

on:
  push:
    branches:
      - consolidation/tracesleuth-0.1.0

permissions:
  contents: write

concurrency:
  group: sync-consolidation-go-metadata
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'DanielDietz-de/TraceSleuth'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v7
        with:
          ref: consolidation/tracesleuth-0.1.0
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Generate canonical module metadata
        run: go mod tidy

      - name: Commit synchronized metadata when required
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- go.mod go.sum; then
            echo 'Go module metadata is already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum
          git commit -m 'chore: synchronize Go module metadata'
          git push origin HEAD:consolidation/tracesleuth-0.1.0
