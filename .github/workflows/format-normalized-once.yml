name: One-time format normalized findings contract
on:
  push:
    branches:
      - feat/tracesleuth-normalized-findings-v0
    paths:
      - .github/workflows/format-normalized-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'DanielDietz-de/TraceSleuth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/tracesleuth-normalized-findings-v0
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Apply canonical gofmt
        run: |
          gofmt -w pkg/models/normalized_finding.go pkg/models/normalized_finding_test.go
          test -z "$(gofmt -l pkg/models/normalized_finding.go pkg/models/normalized_finding_test.go)"
      - name: Commit formatting only
        run: |
          set -euo pipefail
          if git diff --quiet -- pkg/models/normalized_finding.go pkg/models/normalized_finding_test.go; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pkg/models/normalized_finding.go pkg/models/normalized_finding_test.go
          git commit -m 'style(evidence): gofmt normalized findings contract and tests'
          git push origin HEAD:feat/tracesleuth-normalized-findings-v0
