name: Legacy Release — disable this workflow

# Historical commits used this path for unsafe tag-triggered publishing.
# A current-branch stub does not protect historical tag commits. Administrators
# MUST disable this workflow in GitHub Actions (state=disabled_manually).
# Actual guarded releases use independently named validated-release.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Historical publishing has been retired
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy release
        run: |
          echo "::error::This historical workflow must be disabled in GitHub Actions. Use validated-release.yml only after release policy gates are satisfied."
          exit 1
