name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.12'
  NODE_VERSION: '24'
  STATICCHECK_VERSION: 'v0.7.0'
  GOVULNCHECK_VERSION: 'v1.1.4'
  GITLEAKS_VERSION: 'v8.30.1'

jobs:
  frontend-build:
    name: Frontend build artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend and type-check
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee ../../ci-frontend-build.txt

      - name: Upload frontend distribution
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/frontend/dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload frontend build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-diagnostics
          path: ci-frontend-build.txt
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Go format, vet, test and embedded build
    needs: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore built frontend for Go embed
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: cmd/sdwan-triage/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare Go build inputs
        shell: bash
        run: |
          set -euo pipefail
          go mod download all
          mkdir -p cmd/sdwan-triage/data
          cp data/GeoLite2-City.mmdb cmd/sdwan-triage/data/GeoLite2-City.mmdb

      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -l . | tee ci-gofmt.txt
          if [[ -s ci-gofmt.txt ]]; then
            echo 'The following Go files are not gofmt-clean:' >&2
            cat ci-gofmt.txt >&2
            exit 1
          fi

      - name: Prepare formatted-source diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          formatted_dir="${RUNNER_TEMP}/ci-formatted"
          rm -rf "${formatted_dir}"
          if [[ -s ci-gofmt.txt ]]; then
            while IFS= read -r file; do
              [[ -n "${file}" ]] || continue
              target="${formatted_dir}/${file}"
              mkdir -p "$(dirname "${target}")"
              gofmt "${file}" > "${target}"
            done < ci-gofmt.txt
          fi

      - name: Run go vet
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          go vet ./... 2>&1 | tee ci-go-vet.txt

      - name: Run Go tests
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -timeout 5m 2>&1 | tee ci-go-test.txt

      - name: Build backend with embedded frontend
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          go build ./cmd/sdwan-triage 2>&1 | tee ci-go-build.txt

      - name: Upload backend diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            ci-gofmt.txt
            ci-go-vet.txt
            ci-go-test.txt
            ci-go-build.txt
            ${{ runner.temp }}/ci-formatted
            go.mod
            go.sum
          if-no-files-found: ignore
          retention-days: 7

  static-analysis:
    name: Staticcheck
    needs: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore built frontend for Go embed
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: cmd/sdwan-triage/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare Go build inputs
        shell: bash
        run: |
          set -euo pipefail
          go mod download all
          mkdir -p cmd/sdwan-triage/data
          cp data/GeoLite2-City.mmdb cmd/sdwan-triage/data/GeoLite2-City.mmdb

      - name: Install pinned Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}

      - name: Run Staticcheck
        shell: bash
        run: |
          set -euo pipefail
          staticcheck ./... 2>&1 | tee ci-staticcheck.txt

      - name: Upload Staticcheck diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: staticcheck-diagnostics
          path: ci-staticcheck.txt
          if-no-files-found: ignore
          retention-days: 7

  race:
    name: Go race detector
    needs: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore built frontend for Go embed
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: cmd/sdwan-triage/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare Go build inputs
        shell: bash
        run: |
          set -euo pipefail
          go mod download all
          mkdir -p cmd/sdwan-triage/data
          cp data/GeoLite2-City.mmdb cmd/sdwan-triage/data/GeoLite2-City.mmdb

      - name: Run race-enabled tests
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./... -timeout 10m 2>&1 | tee ci-race.txt

      - name: Upload race diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: race-diagnostics
          path: ci-race.txt
          if-no-files-found: ignore
          retention-days: 7

  frontend-quality:
    name: Frontend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        shell: bash
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee ../../ci-frontend-lint.txt

      - name: Run frontend tests
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee ../../ci-frontend-test.txt

      - name: Upload frontend diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-diagnostics
          path: |
            ci-frontend-lint.txt
            ci-frontend-test.txt
          if-no-files-found: ignore
          retention-days: 7

  vulnerability-scan:
    name: Go vulnerability scan
    needs: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore built frontend for Go embed
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: cmd/sdwan-triage/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare Go build inputs
        shell: bash
        run: |
          set -euo pipefail
          go mod download all
          mkdir -p cmd/sdwan-triage/data
          cp data/GeoLite2-City.mmdb cmd/sdwan-triage/data/GeoLite2-City.mmdb

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck
        shell: bash
        run: |
          set -euo pipefail
          govulncheck ./... 2>&1 | tee ci-govulncheck.txt

      - name: Upload govulncheck diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-diagnostics
          path: ci-govulncheck.txt
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install pinned gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@${{ env.GITLEAKS_VERSION }}

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-banner --verbose

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select comparison base
        id: base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ -n "${PR_BASE_SHA:-}" ]]; then
            base="${PR_BASE_SHA}"
          elif [[ -n "${PUSH_BEFORE_SHA:-}" && "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            base="${PUSH_BEFORE_SHA}"
          else
            base="HEAD^"
          fi

          echo "base=${base}" >> "${GITHUB_OUTPUT}"

      - name: Reject new binaries, captures, archives and unintended large files
        run: bash scripts/check-repository-hygiene.sh '${{ steps.base.outputs.base }}'

  version-policy:
    name: Version policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate VERSION format and changelog coverage
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "${version}" =~ ^0\.[0-9]+\.[0-9]+$|^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION is not valid MAJOR.MINOR.PATCH: ${version}" >&2
            exit 1
          fi

          if ! grep -Fq "## [${version}]" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a section for ${version}" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION v${version}" >&2
            exit 1
          fi

          echo "Validated TraceSleuth version ${version}."
