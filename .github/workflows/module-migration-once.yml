name: One-time TraceSleuth Go module migration

# One-shot, branch-scoped source rewrite without executing third-party code.
on:
  push:
    branches:
      - feat/tracesleuth-module-migration
    paths:
      - .github/workflows/module-migration-once.yml

permissions:
  contents: write

jobs:
  rename:
    if: github.repository == 'DanielDietz-de/TraceSleuth'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated migration branch
        uses: actions/checkout@v7
        with:
          ref: feat/tracesleuth-module-migration
          persist-credentials: true
      - name: Rewrite only tracked Go source imports and module declaration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          old = 'github.com/gocisse/sdwan-triage'
          new = 'github.com/DanielDietz-de/TraceSleuth'
          go_mod = Path('go.mod')
          module_text = go_mod.read_text()
          old_module_line = 'module ' + old + '\n'
          assert module_text.count(old_module_line) == 1, 'Unexpected Go module declaration'
          go_mod.write_text(module_text.replace(old_module_line, 'module ' + new + '\n', 1))
          tracked = subprocess.check_output(['git', 'ls-files', '-z', '--', '*.go']).split(b'\x00')
          changes = 0
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode('utf-8'))
              content = path.read_text()
              # Only replace internal module imports; keep historical
              # upstream copyright and reference text unmodified.
              old_import = '"' + old + '/'
              new_import = '"' + new + '/'
              if old_import in content:
                  path.write_text(content.replace(old_import, new_import))
                  changes += 1
          if changes == 0:
              raise SystemExit('No internal Go imports found for controlled migration')
          print('Updated module declaration and', changes, 'tracked Go source files')
          PY

      - name: Commit controlled migration for independent CI and review
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- go.mod '*.go'; then
            echo 'No files changed; refusing empty migration.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- go.mod '*.go'
          git commit -m 'refactor(go): migrate internal module imports to TraceSleuth'
          git push origin HEAD:feat/tracesleuth-module-migration
