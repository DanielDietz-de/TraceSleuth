name: TraceSleuth bootstrap canonical formatting

on:
  push:
    branches:
      - agent/tracesleuth-phase-0-bootstrap

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-format-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/tracesleuth-phase-0-bootstrap

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false

      - name: Apply canonical gofmt to remaining inherited files
        run: |
          set -euo pipefail
          gofmt -w \
            pkg/analyzer/comparator_streaming_test.go \
            pkg/analyzer/qos_aggregator.go \
            pkg/web/handlers/enhanced.go \
            tools/generate_samples/main.go \
            web/backend/handlers/enhanced.go

      - name: Commit exact formatting changes
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code; then
            echo 'No formatting changes remain.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            pkg/analyzer/comparator_streaming_test.go \
            pkg/analyzer/qos_aggregator.go \
            pkg/web/handlers/enhanced.go \
            tools/generate_samples/main.go \
            web/backend/handlers/enhanced.go
          git commit -m 'style: complete canonical gofmt cleanup [skip-format-bootstrap]'
          git push origin HEAD:agent/tracesleuth-phase-0-bootstrap
