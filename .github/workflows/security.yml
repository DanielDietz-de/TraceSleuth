name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: '1.26.9'
  GOVULNCHECK_VERSION: 'v1.1.4'

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare Go embed inputs
        shell: bash
        run: |
          mkdir -p cmd/sdwan-triage/dist cmd/sdwan-triage/data
          printf '<!doctype html><title>TraceSleuth CI placeholder</title>\n' > cmd/sdwan-triage/dist/index.html
          cp data/GeoLite2-City.mmdb cmd/sdwan-triage/data/GeoLite2-City.mmdb

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck
        shell: bash
        run: |
          set -o pipefail
          govulncheck ./... 2>&1 | tee govulncheck-diagnostics.txt

      - name: Upload govulncheck diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: govulncheck-diagnostics
          path: govulncheck-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 14

  frontend-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      # Both checks are mandatory. The first catches vulnerable production
      # dependencies and the second prevents critical build-time tooling risks.
      - name: Audit production and build-time dependencies
        shell: bash
        working-directory: web/frontend
        run: |
          set -uo pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee npm-audit-runtime.txt
          runtime_status=${PIPESTATUS[0]}
          npm audit --audit-level=critical 2>&1 | tee npm-audit-all.txt
          all_status=${PIPESTATUS[0]}
          if ((runtime_status != 0 || all_status != 0)); then
            echo 'Frontend dependency audit failed: investigate the reported advisories.' >&2
            exit 1
          fi

      - name: Upload frontend audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dependency-audit
          path: |
            web/frontend/npm-audit-runtime.txt
            web/frontend/npm-audit-all.txt
          if-no-files-found: ignore
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan repository
        shell: bash
        run: |
          set -o pipefail
          gitleaks detect --source . --redact --no-banner --verbose --config gitleaks.toml 2>&1 | tee gitleaks-diagnostics.txt

      - name: Upload Gitleaks diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-diagnostics
          path: gitleaks-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 14

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare Go embed inputs
        if: matrix.language == 'go'
        shell: bash
        run: |
          mkdir -p cmd/sdwan-triage/dist cmd/sdwan-triage/data
          printf '<!doctype html><title>TraceSleuth CI placeholder</title>\n' > cmd/sdwan-triage/dist/index.html
          cp data/GeoLite2-City.mmdb cmd/sdwan-triage/data/GeoLite2-City.mmdb

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
