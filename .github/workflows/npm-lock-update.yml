name: One-shot frontend lockfile upgrade
on:
  push:
    branches:
      - ci/validated-prerelease-publishing
    paths:
      - .github/workflows/npm-lock-update.yml
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'DanielDietz-de/TraceSleuth'
    name: Regenerate security-patched frontend lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ci/validated-prerelease-publishing
          persist-credentials: true
      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve manifest upgrades without scripts
        working-directory: web/frontend
        run: npm install --package-lock-only --ignore-scripts --strict-peer-deps
      - name: Apply compatible transitive security updates
        working-directory: web/frontend
        shell: bash
        run: |
          if npm audit fix --package-lock-only --ignore-scripts; then
            echo 'No remaining automatically fixable issues.'
          else
            echo 'Security audit will evaluate remaining advisories separately.'
          fi
      - name: Commit only lockfile changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- web/frontend/package.json || {
            echo 'Unexpected manifest mutation; refusing push.' >&2
            exit 1
          }
          if git diff --quiet -- web/frontend/package-lock.json; then
            echo 'No lockfile changes available.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/frontend/package-lock.json
          git commit -m 'fix(deps): lock patched Vite and Vitest security dependency tree'
          git push origin HEAD:ci/validated-prerelease-publishing
