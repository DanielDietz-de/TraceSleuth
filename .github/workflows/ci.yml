name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version contract
        run: bash scripts/check-version-contract.sh

      - name: Validate changed-file hygiene
        shell: bash
        run: |
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            bash scripts/check-repository-hygiene.sh "origin/${GITHUB_BASE_REF}"
          else
            bash scripts/check-repository-hygiene.sh
          fi

  go-quality:
    name: Go format, vet, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify Go formatting
        shell: bash
        run: |
          mapfile -d '' go_files < <(find . -type f -name '*.go' \
            -not -path './web/releases/*' \
            -not -path './releases/*' \
            -print0)

          if ((${#go_files[@]} == 0)); then
            echo 'No Go files found.'
            exit 1
          fi

          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "$unformatted" ]]; then
            printf 'The following Go files are not gofmt-clean:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./... -timeout 120s

  go-race:
    name: Go race tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run race detector
        run: go test -race ./... -timeout 240s

  frontend:
    name: Frontend typecheck, lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  embedded-build:
    name: Embedded frontend and backend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Stage embedded frontend
        run: |
          rm -rf cmd/sdwan-triage/dist
          mkdir -p cmd/sdwan-triage/dist
          cp -R web/frontend/dist/. cmd/sdwan-triage/dist/

      - name: Build TraceSleuth binary
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p build/ci
          go build -trimpath -ldflags "-s -w -X main.version=${version} -X main.buildCommit=${GITHUB_SHA}" -o build/ci/tracesleuth ./cmd/sdwan-triage

      - name: Verify build artifact
        run: test -s build/ci/tracesleuth
